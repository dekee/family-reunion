# Homelab ingress — reunion.home
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: family-reunion-ingress
  namespace: family-reunion
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "homelab-ca-issuer"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - reunion.home
      secretName: reunion-home-tls
  rules:
    - host: reunion.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
